name: crm
description: crm mobile application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^13.0.0

  # API and secure session helpers
  http: ^1.2.2
  file_picker: ^8.1.7

  # Charts
  fl_chart: ^0.68.0

  # UI utilities
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  flutter_secure_storage: ^10.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
